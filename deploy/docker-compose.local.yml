services:
  postgres:
    image: postgres:17-alpine
    container_name: pet-memorial-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pet_memorial}
      POSTGRES_USER: ${POSTGRES_USER:-pet_memorial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pet_memorial_dev}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: pet-memorial-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pet_memorial_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-before-production}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

